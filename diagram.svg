<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400">
  <rect x="20" y="20" width="240" height="80" fill="#f4f4f8" stroke="#333"/>
  <text x="40" y="50" font-family="Arial" font-size="14">API / Controladores</text>
  <rect x="20" y="120" width="240" height="80" fill="#eef7ff" stroke="#333"/>
  <text x="40" y="150" font-family="Arial" font-size="14">Lógica de negocio</text>
  <rect x="20" y="220" width="240" height="80" fill="#fff7e6" stroke="#333"/>
  <text x="40" y="250" font-family="Arial" font-size="14">Acceso a datos (SQLite)</text>

  <rect x="320" y="20" width="420" height="120" fill="#f9f9f9" stroke="#333"/>
  <text x="340" y="50" font-family="Arial" font-size="14">Exposición REST</text>
  <text x="340" y="74" font-family="Arial" font-size="12">POST /resenas</text>
  <text x="340" y="94" font-family="Arial" font-size="12">GET /resenas?producto_id=</text>
  <text x="340" y="114" font-family="Arial" font-size="12">DELETE /resenas/{id} • GET /productos/{id}/promedio</text>

  <line x1="260" y1="60" x2="320" y2="60" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="260" y1="160" x2="320" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="260" y1="260" x2="320" y2="260" stroke="#333" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <text x="40" y="320" font-family="Arial" font-size="12">Integración: otros microservicios pueden consumir los endpoints REST</text>
</svg>
